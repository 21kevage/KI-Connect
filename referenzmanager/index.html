<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WERNER companies | Referenzmanager Demo</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#182538;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#10283b;color:white;padding:30px 18px}.brand{font-size:22px;font-weight:850;letter-spacing:.4px;margin-bottom:5px}.side small{color:#a4b9c5}.nav{margin-top:46px;display:grid;gap:9px}.nav button{border:0;text-align:left;background:transparent;color:#b9ced9;padding:14px 15px;border-radius:12px}.nav button.active,.nav button:hover{background:#23485c;color:white}.main{padding:32px;max-width:1340px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{color:#527186;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:30px;letter-spacing:-.6px;margin:6px 0 7px}p.muted,.muted{color:#66798b}.pill{display:inline-flex;padding:7px 11px;border-radius:25px;font-size:12px;font-weight:700;background:#fff0d8;color:#8b5b09}.btn{border:0;background:#176e83;color:white;padding:12px 18px;border-radius:11px;font-weight:700}.btn:hover{background:#0e5368}.btn.secondary{background:white;color:#1c5264;border:1px solid #cddce5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin:27px 0}.stat,.panel{background:white;border:1px solid #e3eaf0;border-radius:18px;padding:22px;box-shadow:0 6px 25px #122e4207}.stat strong{display:block;font-size:32px;margin:9px 0}.stat span{color:#718292;font-size:13px}.panel{margin-top:17px}.panel h2{margin:0 0 16px;font-size:19px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px}th{text-align:left;font-size:12px;color:#7a8d9d;text-transform:uppercase;letter-spacing:.8px}td,th{padding:15px 12px;border-bottom:1px solid #edf1f4}tr:last-child td{border-bottom:0}.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#e8f4fa;color:#156679;font-size:12px;font-weight:700}.tag.open{background:#fff2d6;color:#8e610c}.tag.approved{background:#e8f6ee;color:#22754b}.tag.declined{background:#fae9e9;color:#a34343}.linkbtn{border:none;background:none;color:#116a87;font-weight:700;text-decoration:underline}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px;font-size:14px;font-weight:700;color:#45586b}.field.full{grid-column:1/-1}input,textarea,select{width:100%;border:1px solid #cfdae3;border-radius:10px;padding:12px;background:white;color:#1b3040}textarea{min-height:108px;resize:vertical}.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.notice{border-radius:13px;padding:15px;background:#eef6fa;border:1px solid #cfe6ef;color:#31566c;margin:18px 0;line-height:1.5}.consent{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid #e5edf2;border-radius:10px;margin:10px 0;line-height:1.5;font-size:14px}.consent input{width:18px;height:18px;flex:0 0 18px;margin-top:1px}.hidden{display:none!important}.empty{padding:25px;text-align:center;color:#66798b}.footer{margin-top:30px;color:#8494a1;font-size:12px}label small{color:#72869a;font-weight:400}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px}.details div{border-bottom:1px solid #eef2f5;padding:9px 0}.details b{display:block;margin-bottom:6px}.customer{max-width:800px;margin:24px auto;background:white;padding:34px;border-radius:20px;box-shadow:0 20px 50px #203b5110}.customer h1{margin:0 0 12px}.customer .brand{color:#113c50;margin-bottom:22px}@media(max-width:800px){.shell{display:block}.side{padding:17px}.nav{display:flex;margin-top:15px;overflow:auto}.nav button{white-space:nowrap}.main{padding:18px}.stats{grid-template-columns:1fr}.formgrid,.details{grid-template-columns:1fr}.field.full{grid-column:auto}.customer{margin:12px;padding:22px}}
</style></head><body>
<div id="app" class="shell"><aside class="side"><div class="brand">WERNER <span style="font-weight:400">companies</span></div><small>Referenzmanagement · Prototyp</small><div class="nav"><button data-view="dashboard" class="active">▦ Übersicht</button><button data-view="new">＋ Neue Anfrage</button><button data-view="requests">☷ Referenzen</button><button data-view="customer">◎ Kundenansicht testen</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow">Kundenreferenzen</div><h1 id="heading">Referenzübersicht</h1><div class="muted" id="subheading">Kundenstimmen zentral anfragen und verwalten</div></div><span class="pill">DEMO · nur Testdaten</span></div><div id="content"></div><div class="footer">Prototyp: Speicherung nur in diesem Browser. Kein Versand, keine zentrale Datenbank, keine rechtsverbindliche Einwilligungsverwaltung.</div></main></div>
<script>
const KEY='werner-references-demo-v1';const initial=[{id:'R-1001',client:'Muster Industrie GmbH',contact:'M. Beispiel',email:'demo1@example.invalid',project:'Unterhaltsreinigung Standort Süd',service:'Unterhaltsreinigung',date:'2026-09-14',status:'approved',rating:'5',usecase:'Regelmäßige Reinigung mehrerer Büroetagen',quote:'Die Zusammenarbeit ist zuverlässig und unkompliziert.',logo:true,nameConsent:true,quoteConsent:true,submitted:'2026-10-02'},{id:'R-1002',client:'Beispiel Logistik AG',contact:'A. Demo',email:'demo2@example.invalid',project:'Facility Services Lagerhalle',service:'Facility Management',date:'2026-10-01',status:'open',quote:'',logo:false},{id:'R-1003',client:'Test & Partner KG',contact:'T. Muster',email:'demo3@example.invalid',project:'Glas- und Sonderreinigung',service:'Sonderreinigung',date:'2026-10-16',status:'received',rating:'4',quote:'Sehr gute Abstimmung im laufenden Projekt.',usecase:'Reinigung großflächiger Glasfassaden',logo:false,nameConsent:true,quoteConsent:true,submitted:'2026-11-05'}];let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial}catch(e){data=initial}let current='dashboard',selected=null;const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function badge(s){return '<span class="tag '+({open:'open',approved:'approved',declined:'declined'}[s]||'')+'">'+({open:'Offen',received:'Eingegangen',approved:'Freigegeben',declined:'Abgelehnt'}[s]||s)+'</span>'}function item(r){return '<tr><td><b>'+esc(r.client)+'</b><br><small class="muted">'+esc(r.contact)+'</small></td><td>'+esc(r.project)+'</td><td>'+badge(r.status)+'</td><td><button class="linkbtn" data-detail="'+esc(r.id)+'">Ansehen</button></td></tr>'}function table(rows){return '<div class="tablewrap"><table><thead><tr><th>Kunde</th><th>Projekt</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(item).join('')+'</tbody></table></div>'}function dashboard(){let n=s=>data.filter(r=>r.status===s).length;return '<section class="stats"><div class="stat"><span>Anfragen gesamt</span><strong>'+data.length+'</strong></div><div class="stat"><span>Offene Anfragen</span><strong>'+n('open')+'</strong></div><div class="stat"><span>Freigegebene Referenzen</span><strong>'+n('approved')+'</strong></div></section><section class="panel"><div class="top"><h2>Aktuelle Anfragen</h2><button class="btn" data-view="new">+ Anfrage erstellen</button></div>'+table(data.slice().reverse())+'</section>'}function requests(){return '<section class="panel"><h2>Alle Referenzanfragen</h2><label class="field">Status filtern<select id="filter"><option value="all">Alle</option><option value="open">Offen</option><option value="received">Eingegangen</option><option value="approved">Freigegeben</option><option value="declined">Abgelehnt</option></select></label><div id="table-area">'+table(data)+'</div></section>'}function newForm(){return '<section class="panel"><h2>Neue Referenzanfrage</h2><form id="create"><div class="formgrid"><label class="field">Kundenunternehmen *<input name="client" required placeholder="Beispiel GmbH"></label><label class="field">Ansprechpartner *<input name="contact" required placeholder="Vorname Nachname"></label><label class="field">E-Mail (nur Demo, kein Versand) *<input type="email" name="email" required placeholder="kontakt@example.invalid"></label><label class="field">Projektstart<input type="date" name="date"></label><label class="field">Projektname *<input name="project" required placeholder="z. B. Unterhaltsreinigung"></label><label class="field">Leistung *<input name="service" required placeholder="z. B. Facility Management"></label><label class="field full">Optionaler Referenztext als Vorschlag<textarea name="proposal" placeholder="Der Kunde kann diesen Text im Formular ändern."></textarea></label></div><div class="notice">Demo: Die Anfrage wird nur in diesem Browser angelegt. Es wird keine E-Mail versendet und kein extern nutzbarer Kundenlink erzeugt.</div><div class="actions"><button class="btn" type="submit">Anfrage anlegen</button><button class="btn secondary" type="button" data-view="dashboard">Abbrechen</button></div></form></section>'}function detail(){const r=data.find(x=>x.id===selected);if(!r)return dashboard();return '<section class="panel"><div class="top"><h2>'+esc(r.client)+'</h2>'+badge(r.status)+'</div><div class="details">'+[['Anfragenummer',r.id],['Ansprechpartner',r.contact],['E-Mail',r.email],['Projekt',r.project],['Leistung',r.service],['Projektstart',r.date||'–'],['Bewertung',r.rating?r.rating+' / 5':'–'],['Use Case',r.usecase||'–'],['Referenztext',r.quote||'–'],['Logonutzung erlaubt',r.logo?'Ja':'Nein'],['Unternehmensname erlaubt',r.nameConsent?'Ja':'Nein'],['Zitatnutzung erlaubt',r.quoteConsent?'Ja':'Nein'],['Antwortdatum',r.submitted||'–']].map(a=>'<div><b>'+a[0]+'</b>'+esc(a[1])+'</div>').join('')+'</div><div class="actions"><button class="btn secondary" data-view="requests">Zurück</button><button class="btn" data-customer="'+esc(r.id)+'">Kundenansicht öffnen</button>'+(r.status==='received'?'<button class="btn" data-approve="'+esc(r.id)+'">Intern freigeben</button>':'')+'</div></section>'}function customer(){const r=data.find(x=>x.id===selected)||data.find(x=>x.status==='open')||data[0];if(!r)return '<div class="empty">Noch keine Anfragen</div>';selected=r.id;return '<section class="customer"><div class="brand">WERNER companies</div><div class="eyebrow">Demo · Kundenansicht</div><h1>Ihre Erfahrung mit uns</h1><p class="muted">Vielen Dank für die Zusammenarbeit. Wir freuen uns über eine kurze Rückmeldung zu Ihrem Projekt.</p><div class="notice"><b>'+esc(r.project)+'</b><br>'+esc(r.client)+' · '+esc(r.service)+'<br>Dies ist eine Testansicht. Es werden keine Daten an WERNER companies übermittelt.</div><form id="feedback"><label class="field">Wie bewerten Sie die Zusammenarbeit?<select name="rating" required><option value="">Bitte auswählen</option>'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(String(r.rating)===String(n)?'selected':'')+'>'+n+' von 5</option>').join('')+'</select></label><br><label class="field">Welche Leistungen oder Anwendungsfälle waren besonders relevant?<textarea name="usecase" placeholder="Beschreiben Sie Ihren Use Case">'+esc(r.usecase||'')+'</textarea></label><br><label class="field">Ihr Erfahrungsbericht<textarea name="quote" placeholder="Ihre Bewertung in eigenen Worten">'+esc(r.quote||r.proposal||'')+'</textarea><small>Sie können einen vorbereiteten Text verändern oder einen eigenen schreiben.</small></label><h2>Freigaben zur Nutzung</h2><p class="muted">Bitte entscheiden Sie getrennt über jede Verwendung. Keine Auswahl ist vorangekreuzt.</p><label class="consent"><input type="checkbox" name="quoteConsent"> Ich stimme der Verwendung meines freigegebenen Referenztextes für Angebote, Ausschreibungen und Unternehmensmarketing zu.</label><label class="consent"><input type="checkbox" name="nameConsent"> Ich stimme zu, dass mein Unternehmensname im Zusammenhang mit dieser Referenz genannt wird.</label><label class="consent"><input type="checkbox" name="logo"> Ich erlaube die Verwendung unseres Unternehmenslogos im Zusammenhang mit dieser Referenz. Ein Logo müsste separat bereitgestellt werden.</label><p class="muted">Hinweis: Eine produktive Version benötigt rechtlich geprüfte Hinweise, dokumentierte Berechtigungen und einen Widerrufsprozess.</p><div class="actions"><button class="btn" type="submit">Demo-Antwort speichern</button><button class="btn secondary" type="button" data-decline="'+esc(r.id)+'">Keine Referenz erteilen</button></div></form></section>'}function render(v){current=v;$('.nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#heading').textContent=({dashboard:'Referenzübersicht',new:'Referenz anfragen',requests:'Referenzen verwalten',detail:'Referenzdetails',customer:'Kundenformular'})[v];$('#subheading').textContent=v==='customer'?'Vorschau aus Sicht des Kunden':'Kundenstimmen zentral anfragen und verwalten';$('#content').innerHTML=({dashboard,new:newForm,requests,detail,customer})[v]();window.scrollTo(0,0)}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)render(b.dataset.view);if(b.dataset.detail){selected=b.dataset.detail;render('detail')}if(b.dataset.customer){selected=b.dataset.customer;render('customer')}if(b.dataset.approve){let r=data.find(x=>x.id===b.dataset.approve);r.status='approved';save();render('detail')}if(b.dataset.decline){let r=data.find(x=>x.id===b.dataset.decline);r.status='declined';r.quoteConsent=false;r.nameConsent=false;r.logo=false;save();alert('Demo-Ablehnung gespeichert.');render('dashboard')}});document.addEventListener('change',e=>{if(e.target.id==='filter')$('#table-area').innerHTML=table(data.filter(r=>e.target.value==='all'||r.status===e.target.value))});document.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);if(e.target.id==='create'){let r={id:'R-'+Date.now(),client:f.get('client'),contact:f.get('contact'),email:f.get('email'),date:f.get('date'),project:f.get('project'),service:f.get('service'),proposal:f.get('proposal'),status:'open',logo:false};data.unshift(r);save();selected=r.id;render('detail')}else if(e.target.id==='feedback'){let r=data.find(x=>x.id===selected);Object.assign(r,{rating:f.get('rating'),usecase:f.get('usecase'),quote:f.get('quote'),quoteConsent:f.has('quoteConsent'),nameConsent:f.has('nameConsent'),logo:f.has('logo'),status:'received',submitted:new Date().toISOString().slice(0,10)});save();alert('Demo-Antwort in diesem Browser gespeichert.');render('detail')}});render('dashboard');
</script></body></html>
